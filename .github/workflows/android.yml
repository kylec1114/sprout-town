name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  issues: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: node --check src/main.js && node --check src/audio.js && node --check src/characters.js && node --check src/story.js
      - run: npm run build
      - run: test -s dist/audio/warm-window.wav
      - run: npx cap add android && npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk sprout-town-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sprout-town-debug-apk
          path: sprout-town-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish private repository prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" sprout-town-debug.apk --target "$GITHUB_SHA" --prerelease --title "Testing APK $TAG" --notes "Healing chapter 1. Bundled generated music. Debug build; not device-tested or a production release."
          echo "APK_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Notify Kyle after APK is published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          URL="https://github.com/$GH_REPO/releases/tag/$APK_TAG"
          gh issue create --title "APK ready: $APK_TAG" --body "@kylec1114 新測試 APK 已編譯並上傳：$URL 。下載 Assets 下的 sprout-town-debug.apk。這是 debug 測試版，未經手機遊玩驗收；請先確認版本與來源。"
