<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>苔苔與硃砂｜第一盞燈</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#182631;color:#fff1d6;font:15px system-ui}canvas{display:block;touch-action:none}.panel{position:fixed;z-index:10;background:#1e2d38ed;border:1px solid #c9b68c66;border-radius:16px;padding:14px;box-shadow:0 8px 24px #0003}#hud{top:12px;left:12px;max-width:57vw}#goal{font-size:13px;line-height:1.7;margin-top:6px}#sound{right:12px;top:12px;font-size:12px}label{display:block}input{width:75px}button{font:inherit;padding:11px 14px;border:0;border-radius:10px;background:#d8dca9;color:#323c30;touch-action:none;user-select:none}button:active{background:#a8bc85}#hint{bottom:90px;left:50%;transform:translateX(-50%);text-align:center;max-width:90vw;width:max-content;font-size:13px}#move{position:fixed;bottom:18px;left:12px;display:flex;gap:4px;z-index:20}#move button{padding:12px}#act{position:fixed;bottom:18px;right:12px;z-index:20}#modal{bottom:110px;left:50%;transform:translateX(-50%);width:min(540px,92vw);z-index:30}#text{white-space:pre-line;line-height:1.9;margin:12px 0}#speaker{color:#f4cf86;font-weight:bold}#wires{display:flex;gap:10px;margin:12px 0}#start{position:fixed;inset:0;background:#182631ed;z-index:50;display:grid;place-items:center}.intro{max-width:460px;padding:28px;text-align:center;line-height:1.8}h1{color:#efd59b}[hidden]{display:none!important}@media(max-width:600px){#hud{font-size:13px}#sound{padding:9px}input{width:55px}#move button{padding:11px 9px}}
</style></head><body>
<div id="hud" class="panel"><b>第一關 · 第一盞燈</b><div id="goal">準備開工。</div></div><div id="sound" class="panel"><label>音樂 <input id="music" type="range" min="0" max="1" step="0.01" value="0.35"></label><label>音效 <input id="sfx" type="range" min="0" max="1" step="0.01" value="0.45"></label><button id="mute">靜音</button></div>
<div id="hint" class="panel">WASD 移動 · 拖曳轉鏡頭 · E 互動</div><div id="move"><button data-key="ArrowLeft">◀</button><button data-key="ArrowUp">▲</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button><button data-key="ShiftLeft">跑</button></div><button id="act">互動 E</button>
<div id="modal" class="panel" hidden><div id="speaker"></div><div id="text"></div><div id="wires" hidden><button data-wire="blue">藍・低</button><button data-wire="green">綠・中</button><button data-wire="gold">金・高</button><button id="listen">再聽</button></div><button id="next">繼續</button></div>
<div id="start"><div class="intro"><h1>苔苔與硃砂</h1><h2>第一盞燈</h2><p>晚上 11:47，距離收工仲有十三分鐘。<br>苔苔只想整完盞燈，買個麵包返屋企。<br>硃砂就想睇吓佢今次又點射波。</p><p>WASD／方向鍵移動 · Shift 跑步<br>拖曳轉鏡頭 · E 互動</p><button id="begin">開始開工</button></div></div>
<script type="module" src="/src/main.js"></script></body></html>
